<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugins</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-base: #0f172a;
            --bg-panel: rgba(15, 23, 42, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.05);

            --kpi-green:  #10b981;
            --kpi-blue:   #3b82f6;
            --kpi-purple: #a855f7;
            --kpi-orange: #f59e0b;
            --kpi-pink:   #ec4899;
            --kpi-red:    #ef4444;
            --kpi-cyan:   #06b6d4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(168,85,247,0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16,185,129,0.07), transparent 25%);
            font-family: 'Urbanist', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .home-link {
            position: fixed; top: 14px; left: 20px; z-index: 100;
            font: 600 13px Urbanist, system-ui, sans-serif; color: #e2e8f0; text-decoration: none;
            background: #152439; border: 1px solid #34506b; border-radius: 24px; padding: 9px 15px;
        }

        .map-header { text-align: center; margin: 20px 0 40px; max-width: 820px; animation: fadeInDown 0.8s ease-out; }
        .map-header h1 { font-size: 48px; font-weight: 900; letter-spacing: -1px; margin-bottom: 10px; }
        .map-header p  { font-size: 18px; color: var(--text-muted); line-height: 1.5; margin-bottom: 30px; }

        .progress-container {
            display: flex; align-items: center; justify-content: center; gap: 20px;
            background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass);
            padding: 15px 30px; border-radius: 100px;
            width: fit-content; margin: 0 auto;
        }
        .progress-text { text-align: left; }
        .progress-text strong { display: block; font-size: 18px; color: var(--kpi-purple); }
        .progress-text span   { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        .progress-bar-bg  { width: 200px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .progress-bar-fill{ height: 100%; width: 0%; background: var(--kpi-purple); transition: width 1s cubic-bezier(0.16,1,0.3,1); box-shadow: 0 0 10px var(--kpi-purple); }

        .ecosystem-wrapper { max-width: 1400px; width: 100%; display: flex; flex-direction: column; gap: 40px; animation: fadeIn 1s ease-out; }

        .category-header {
            font-size: 14px; font-weight: 800; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1.5px;
            margin-bottom: 10px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 10px;
        }

        .pillars-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .category-column { display: flex; flex-direction: column; gap: 15px; }

        .module-card {
            background: var(--bg-panel); backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass); border-radius: 16px;
            padding: 20px; text-decoration: none;
            display: flex; align-items: center; gap: 15px;
            transition: all 0.3s ease; position: relative; overflow: hidden; cursor: pointer;
        }
        .module-card:hover { transform: translateY(-4px); background: rgba(30,41,59,0.9); box-shadow: 0 15px 30px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.15); }
        .module-card:focus-visible { outline: 3px solid var(--kpi-purple); outline-offset: 4px; }
        .module-card.visited { border-left: 4px solid var(--kpi-green); }
        .module-card.visited .status-indicator { background: rgba(16,185,129,0.2); border-color: var(--kpi-green); color: var(--kpi-green); box-shadow: 0 0 10px rgba(16,185,129,0.3); }
        .module-icon { width: 50px; height: 50px; border-radius: 12px; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; transition: 0.3s; }
        .module-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .module-info strong { font-size: 16px; color: var(--text-main); font-weight: 800; }
        .module-info span   { font-size: 12px; color: var(--text-muted); font-weight: 600; line-height: 1.4; }
        .status-indicator { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; color: transparent; font-size: 10px; transition: 0.3s; flex-shrink: 0; }
        .new-tag { position: absolute; top: 12px; right: 12px; font-size: 9.5px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: #d8b4fe; background: rgba(168,85,247,0.14); border: 1px solid rgba(168,85,247,0.3); border-radius: 999px; padding: 3px 9px; }
        .module-card:has(.new-tag) .module-info strong { padding-right: 60px; }

        .card-hero { background: linear-gradient(135deg, rgba(30,41,59,0.9) 0%, rgba(15,23,42,0.9) 100%); border: 1px solid var(--kpi-purple); box-shadow: 0 0 30px rgba(168,85,247,0.15); padding: 30px; width: 100%; }
        .card-hero .module-icon { width: 70px; height: 70px; font-size: 30px; background: rgba(168,85,247,0.2); color: var(--kpi-purple); }
        .card-hero .module-info strong { font-size: 24px; }
        .card-hero .module-info span   { font-size: 15px; }

        .btn-reset { margin-top: 50px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: inherit; }
        .btn-reset:hover { color: white; background: rgba(255,255,255,0.05); }

        @keyframes fadeInDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeIn     { from { opacity:0; } to { opacity:1; } }
        @media (prefers-reduced-motion: reduce) {
            .map-header, .ecosystem-wrapper { animation: none; }
            .module-card { transition: none; }
            .module-card:hover { transform: none; }
        }

        @media (max-width: 1200px) { .pillars-row { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .pillars-row { grid-template-columns: 1fr; gap: 40px; }
            .map-header { margin-top: 40px; }
            .map-header h1 { font-size: 36px; }
            .map-header p  { font-size: 16px; }
            .progress-container { flex-direction: column; text-align: center; gap: 10px; }
            .progress-text { text-align: center; }
            .progress-bar-bg { width: 160px; }
            .card-hero { padding: 20px; }
            .card-hero .module-icon { width: 54px; height: 54px; font-size: 24px; }
            .card-hero .module-info strong { font-size: 20px; }
            .card-hero .module-info span   { font-size: 13px; }
            .home-link { left: 12px; }
        }
    </style>
</head>
<body>
    <a class="home-link" href="../mainindex.html">← El ecosistema</a>

    <div class="map-header">
        <h1>Plugins</h1>
        <p>Un instructivo en dos partes: cómo se usa un plugin en una sede, y cómo se arma, se envía a revisión y se publica uno propio. Lo que todavía no existe en la app está marcado como "En el plan".</p>

        <div class="progress-container">
            <div class="progress-text">
                <strong id="progressCount">0 / 0</strong>
                <span>Apartados explorados</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
    </div>

    <div class="ecosystem-wrapper">
        <div id="dashboard-container"></div>

        <div class="pillars-row">
            <div class="category-column" id="col-usar">
                <div class="category-header"><i class="fas fa-store" style="color: var(--kpi-cyan);"></i> Para usarlos</div>
            </div>
            <div class="category-column" id="col-armar">
                <div class="category-header"><i class="fas fa-code" style="color: var(--kpi-purple);"></i> Armar uno propio</div>
            </div>
            <div class="category-column" id="col-publicar">
                <div class="category-header"><i class="fas fa-rocket" style="color: var(--kpi-green);"></i> Publicarlo</div>
            </div>
        </div>
    </div>

    <button class="btn-reset" onclick="resetProgress()">
        <i class="fas fa-undo" style="margin-right: 6px;"></i> Reiniciar progreso
    </button>

    <script>
        const modules = [
            {
                id: 'concepto',
                name: 'Qué es un plugin',
                desc: 'Una pieza que se enchufa en un lugar fijo de la sede: los que vienen con el sistema, los de comunidad, y qué puede hacer cada uno hoy.',
                file: 'concepto.html',
                icon: 'fas fa-puzzle-piece',
                color: '#a855f7',
                target: 'dashboard'
            },

            // Para usarlos
            {
                id: 'catalogo',
                name: 'La tienda de plugins',
                desc: 'Explorar, Mi biblioteca y Mis publicaciones: cómo se busca un plugin, qué dice su ficha y qué pasa al obtenerlo.',
                file: 'catalogo.html',
                icon: 'fas fa-store',
                color: '#06b6d4',
                target: 'col-usar'
            },
            {
                id: 'gestion',
                name: 'Usar un plugin en una sede',
                desc: 'Los lugares de la sede donde se elige un plugin, cómo se vuelve a Manual, y el importador de catálogo que corre un plugin de comunidad.',
                file: 'gestion.html',
                icon: 'fas fa-sliders',
                color: '#3b82f6',
                target: 'col-usar'
            },

            // Armar uno propio
            {
                id: 'manifest',
                name: 'Armar el paquete',
                desc: 'El ZIP, el manifest.json campo por campo y los límites de tamaño, con los mensajes exactos que da el control automático.',
                file: 'manifest.html',
                icon: 'fas fa-file-zipper',
                color: '#a855f7',
                target: 'col-armar'
            },
            {
                id: 'api',
                name: 'Escribir el código',
                desc: 'El adapter.py de un importador: la clase, extract() y el formato de productos y precios que espera la sede.',
                file: 'api.html',
                icon: 'fas fa-code',
                color: '#d946ef',
                target: 'col-armar'
            },
            {
                id: 'sandbox',
                name: 'Seguridad y aislamiento',
                desc: 'Qué código se rechaza antes de llegar a revisión, qué permisos se piden, y cómo corre aislado un plugin aprobado.',
                file: 'sandbox.html',
                icon: 'fas fa-shield-halved',
                color: '#ef4444',
                target: 'col-armar'
            },

            // Publicarlo
            {
                id: 'auditoria',
                name: 'Enviar a revisión',
                desc: 'Lo que ve quien publica y lo que ve quien revisa, las devoluciones con notas y el acceso de prueba.',
                file: 'auditoria.html',
                icon: 'fas fa-user-shield',
                color: '#f59e0b',
                target: 'col-publicar'
            },
            {
                id: 'lanzamiento',
                name: 'Ya publicado',
                desc: 'La ficha, las calificaciones, los enlaces de soporte y cómo entra una versión nueva.',
                file: 'lanzamiento.html',
                icon: 'fas fa-rocket',
                color: '#10b981',
                target: 'col-publicar'
            },
            {
                id: 'monetizacion',
                name: 'Precio y cobro',
                desc: 'El precio que se declara y se muestra, por qué todavía no se cobra, y el caso del plugin a medida.',
                file: 'monetizacion.html',
                icon: 'fas fa-tag',
                color: '#f59e0b',
                target: 'col-publicar'
            },
        ];

        const PROGRESS_KEY = 'plugins_20261007_visited_';
        function readProgress(id) { try { return localStorage.getItem(PROGRESS_KEY + id); } catch { return null; } }

        function renderModules() {
            document.querySelectorAll('.module-card').forEach(card => card.remove());
            let visitedCount = 0;

            modules.forEach(mod => {
                const isVisited = readProgress(mod.id) === 'true';
                if (isVisited) visitedCount++;

                const isHero = mod.target === 'dashboard';
                const cardHTML = `
                    <a href="${mod.file}" onclick="markVisited('${mod.id}')" class="module-card ${isHero ? 'card-hero' : ''} ${isVisited ? 'visited' : ''}">
                        ${mod.isNew ? '<span class="new-tag">Nuevo</span>' : ''}
                        <div class="module-icon" style="color: ${mod.color};"><i class="${mod.icon}"></i></div>
                        <div class="module-info">
                            <strong>${mod.name}</strong>
                            <span>${mod.desc}</span>
                        </div>
                        <div class="status-indicator">
                            <i class="fas fa-check"></i>
                        </div>
                    </a>
                `;

                if (isHero) {
                    document.getElementById('dashboard-container').innerHTML = cardHTML;
                } else {
                    document.getElementById(mod.target)?.insertAdjacentHTML('beforeend', cardHTML);
                }
            });

            updateProgress(visitedCount);
        }

        function markVisited(id) {
            try { localStorage.setItem(PROGRESS_KEY + id, 'true'); } catch {}
        }

        function updateProgress(count) {
            const total = modules.length;
            document.getElementById('progressCount').innerText = `${count} / ${total}`;
            document.getElementById('progressBar').style.width = `${total ? (count / total) * 100 : 0}%`;
        }

        function resetProgress() {
            try { modules.forEach(mod => localStorage.removeItem(PROGRESS_KEY + mod.id)); } catch {}
            location.reload();
        }

        // Al volver con el boton atras el navegador restaura la pagina de cache:
        // sin esto la tarjeta recien visitada no aparece tildada.
        window.addEventListener('pageshow', renderModules);
        renderModules();
    </script>

</body>
</html>
